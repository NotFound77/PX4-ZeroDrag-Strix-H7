<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .title { fill: #58a6ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 22px; font-weight: bold; }
      .subtitle { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
      .group-card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .group-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; }
      .hdr-text { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; }
      .cell-text { fill: #c9d1d9; font-family: monospace; font-size: 12px; }
      .cell-sub { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; }
      .tag-dshot { fill: #238636; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; font-weight: bold; }
      .tag-pwm { fill: #8957e5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; font-weight: bold; }
      .badge-bg-green { fill: #1f6feb22; stroke: #3fb950; stroke-width: 1; rx: 4px; }
      .badge-bg-purple { fill: #8957e522; stroke: #a371f7; stroke-width: 1; rx: 4px; }
    </style>
  </defs>

  <rect width="920" height="620" class="bg" />

  <text x="40" y="45" class="title">ZeroDrag Strix H7 R0.2 — Timer &amp; Actuator Output Architecture</text>
  <text x="40" y="68" class="subtitle">Per-Timer Protocol Decoupling, DMA Stream Allocation &amp; PX4 Mixing Model</text>

  <!-- Group 1: Timer 0 (TIM3) -->
  <g transform="translate(40, 95)">
    <rect width="840" height="110" class="group-card" />
    <text x="20" y="30" class="group-title" fill="#58a6ff">TIMER 0 — STM32 TIM3 (Motor Outputs S1 &amp; S2)</text>
    <text x="500" y="30" class="cell-sub">PX4 Parameter: <tspan fill="#f0883e" font-family="monospace" font-weight="bold">PWM_MAIN_TIM0</tspan> (-4: DShot300, -3: DShot600, 400: PWM)</text>
    
    <line x1="20" y1="42" x2="820" y2="42" stroke="#30363d" stroke-width="1" />
    
    <text x="30" y="65" class="cell-text" fill="#79c0ff">S1 (Motor 1)</text>
    <text x="160" y="65" class="cell-text">TIM3_CH3 (AF2)</text>
    <text x="320" y="65" class="cell-text">Pin PB0</text>
    <text x="440" y="65" class="cell-text">DMA1 (DMAMAP_DMA12_TIM3UP_0)</text>
    <rect x="710" y="52" width="100" height="18" class="badge-bg-green" />
    <text x="760" y="65" class="tag-dshot" text-anchor="middle">DSHOT / PWM</text>

    <text x="30" y="92" class="cell-text" fill="#79c0ff">S2 (Motor 2)</text>
    <text x="160" y="92" class="cell-text">TIM3_CH4 (AF2)</text>
    <text x="320" y="92" class="cell-text">Pin PB1</text>
    <text x="440" y="92" class="cell-text">DMA1 (DMAMAP_DMA12_TIM3UP_0)</text>
    <rect x="710" y="79" width="100" height="18" class="badge-bg-green" />
    <text x="760" y="92" class="tag-dshot" text-anchor="middle">DSHOT / PWM</text>
  </g>

  <!-- Group 2: Timer 1 (TIM5) -->
  <g transform="translate(40, 220)">
    <rect width="840" height="160" class="group-card" />
    <text x="20" y="30" class="group-title" fill="#58a6ff">TIMER 1 — STM32 TIM5 (Motor Outputs S3 &amp; S4 + Aux S5 &amp; S6)</text>
    <text x="500" y="30" class="cell-sub">PX4 Parameter: <tspan fill="#f0883e" font-family="monospace" font-weight="bold">PWM_MAIN_TIM1</tspan> (-4: DShot300, -3: DShot600, 400: PWM)</text>
    
    <line x1="20" y1="42" x2="820" y2="42" stroke="#30363d" stroke-width="1" />
    
    <text x="30" y="65" class="cell-text" fill="#79c0ff">S3 (Motor 3)</text>
    <text x="160" y="65" class="cell-text">TIM5_CH1 (AF2)</text>
    <text x="320" y="65" class="cell-text">Pin PA0</text>
    <text x="440" y="65" class="cell-text">DMA1 (DMAMAP_DMA12_TIM5UP_0)</text>
    <rect x="710" y="52" width="100" height="18" class="badge-bg-green" />
    <text x="760" y="65" class="tag-dshot" text-anchor="middle">DSHOT / PWM</text>

    <text x="30" y="90" class="cell-text" fill="#79c0ff">S4 (Motor 4)</text>
    <text x="160" y="90" class="cell-text">TIM5_CH2 (AF2)</text>
    <text x="320" y="90" class="cell-text">Pin PA1</text>
    <text x="440" y="90" class="cell-text">DMA1 (DMAMAP_DMA12_TIM5UP_0)</text>
    <rect x="710" y="77" width="100" height="18" class="badge-bg-green" />
    <text x="760" y="90" class="tag-dshot" text-anchor="middle">DSHOT / PWM</text>

    <text x="30" y="115" class="cell-text">S5 (Aux / Motor 5)</text>
    <text x="160" y="115" class="cell-text">TIM5_CH3 (AF2)</text>
    <text x="320" y="115" class="cell-text">Pin PA2</text>
    <text x="440" y="115" class="cell-text">DMA1 (DMAMAP_DMA12_TIM5UP_0)</text>
    <rect x="710" y="102" width="100" height="18" class="badge-bg-green" />
    <text x="760" y="115" class="tag-dshot" text-anchor="middle">DSHOT / PWM</text>

    <text x="30" y="140" class="cell-text">S6 (Aux / Motor 6)</text>
    <text x="160" y="140" class="cell-text">TIM5_CH4 (AF2)</text>
    <text x="320" y="140" class="cell-text">Pin PA3</text>
    <text x="440" y="140" class="cell-text">DMA1 (DMAMAP_DMA12_TIM5UP_0)</text>
    <rect x="710" y="127" width="100" height="18" class="badge-bg-green" />
    <text x="760" y="140" class="tag-dshot" text-anchor="middle">DSHOT / PWM</text>
  </g>

  <!-- Group 3: Timer 2 (TIM4) -->
  <g transform="translate(40, 395)">
    <rect width="840" height="110" class="group-card" />
    <text x="20" y="30" class="group-title" fill="#58a6ff">TIMER 2 — STM32 TIM4 (Auxiliary Outputs S7–S10)</text>
    <text x="500" y="30" class="cell-sub">PX4 Parameter: <tspan fill="#f0883e" font-family="monospace" font-weight="bold">PWM_MAIN_TIM2</tspan> (Default: 400 Hz PWM)</text>
    
    <line x1="20" y1="42" x2="820" y2="42" stroke="#30363d" stroke-width="1" />
    
    <text x="30" y="65" class="cell-text">S7 - S8</text>
    <text x="160" y="65" class="cell-text">TIM4_CH1, CH2 (AF2)</text>
    <text x="320" y="65" class="cell-text">Pins PD12, PD13</text>
    <text x="440" y="65" class="cell-text">DMA1 (DMAMAP_DMA12_TIM4UP_0)</text>
    <rect x="710" y="52" width="100" height="18" class="badge-bg-green" />
    <text x="760" y="65" class="tag-dshot" text-anchor="middle">DSHOT / PWM</text>

    <text x="30" y="92" class="cell-text">S9 - S10</text>
    <text x="160" y="92" class="cell-text">TIM4_CH3, CH4 (AF2)</text>
    <text x="320" y="92" class="cell-text">Pins PD14, PD15</text>
    <text x="440" y="92" class="cell-text">DMA1 (DMAMAP_DMA12_TIM4UP_0)</text>
    <rect x="710" y="79" width="100" height="18" class="badge-bg-green" />
    <text x="760" y="92" class="tag-dshot" text-anchor="middle">DSHOT / PWM</text>
  </g>

  <!-- Group 4: Timer 3 (TIM15) -->
  <g transform="translate(40, 520)">
    <rect width="840" height="75" class="group-card" />
    <text x="20" y="28" class="group-title" fill="#58a6ff">TIMER 3 — STM32 TIM15 (Dedicated PWM Servo Outputs S11 &amp; S12)</text>
    <text x="500" y="28" class="cell-sub">PX4 Parameter: <tspan fill="#f0883e" font-family="monospace" font-weight="bold">PWM_MAIN_TIM3</tspan> (50-400 Hz PWM Only)</text>
    
    <line x1="20" y1="38" x2="820" y2="38" stroke="#30363d" stroke-width="1" />
    
    <text x="30" y="58" class="cell-text">S11 - S12</text>
    <text x="160" y="58" class="cell-text">TIM15_CH1, CH2 (AF4)</text>
    <text x="320" y="58" class="cell-text">Pins PE5, PE6</text>
    <text x="440" y="58" class="cell-text" fill="#8b949e">No DMA (TIM15 lacks DMAR burst register)</text>
    <rect x="710" y="45" width="100" height="18" class="badge-bg-purple" />
    <text x="760" y="58" class="tag-pwm" text-anchor="middle">PWM ONLY</text>
  </g>
</svg>