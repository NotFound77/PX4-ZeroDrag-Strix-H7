<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .title { fill: #58a6ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 22px; font-weight: bold; }
      .subtitle { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .mcu-box { fill: #1f2937; stroke: #58a6ff; stroke-width: 2.5; rx: 12px; }
      .mcu-title { fill: #58a6ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 18px; font-weight: bold; }
      .mcu-sub { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; }
      .section-title { fill: #f0883e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; }
      .item-text { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; }
      .item-sub { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; }
      .bus-line { stroke: #58a6ff; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .bus-label { fill: #79c0ff; font-family: monospace; font-size: 10px; }
      .accent-green { fill: #3fb950; font-weight: bold; }
      .accent-blue { fill: #58a6ff; font-weight: bold; }
      .accent-purple { fill: #bc8cff; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" class="bg" />

  <!-- Header -->
  <text x="40" y="45" class="title">ZeroDrag Strix H7 R0.2 — Hardware Overview</text>
  <text x="40" y="68" class="subtitle">STM32H743VIH6 Flight Controller Architecture &amp; Peripheral Interconnect</text>

  <!-- Central MCU Box -->
  <rect x="310" y="160" width="280" height="280" class="mcu-box" />
  <text x="450" y="210" class="mcu-title" text-anchor="middle">STM32H743VIH6</text>
  <text x="450" y="235" class="mcu-sub" text-anchor="middle">ARM Cortex-M7 @ 480 MHz</text>
  <text x="450" y="255" class="item-sub" text-anchor="middle">2 MB Flash (Dual-Bank, 128KB Sectors)</text>
  <text x="450" y="272" class="item-sub" text-anchor="middle">1 MB RAM (AXI SRAM + DTCM + ITCM)</text>

  <rect x="330" y="295" width="240" height="125" fill="#0d1117" rx="6" stroke="#30363d" />
  <text x="345" y="320" class="item-text"><tspan class="accent-blue">DMA1:</tspan> Dedicated to DShot Timer Bursts</text>
  <text x="345" y="342" class="item-text"><tspan class="accent-green">DMA2:</tspan> Dedicated to SPI1 &amp; SPI4 IMUs</text>
  <text x="345" y="364" class="item-text"><tspan class="accent-purple">HRT:</tspan> TIM8 Dedicated 32-bit Counter</text>
  <text x="345" y="386" class="item-text">• VBUS Sense: Software Controlled</text>
  <text x="345" y="405" class="item-text">• Bootloader Reserved: Sector 0 (128 KB)</text>

  <!-- Left: IMUs & Baro (Sensors) -->
  <rect x="40" y="110" width="220" height="100" class="box" />
  <text x="55" y="135" class="section-title">PRIMARY IMU (IMU 1)</text>
  <text x="55" y="157" class="item-text">InvenSense ICM-42688-P</text>
  <text x="55" y="175" class="item-sub">SPI1: SCK PA5, MISO PA6, MOSI PB5</text>
  <text x="55" y="193" class="item-sub">CS: PB12 | DRDY: PC4 | Rot: -R 6 (270°)</text>

  <rect x="40" y="230" width="220" height="100" class="box" />
  <text x="55" y="255" class="section-title">SECONDARY IMU (IMU 2)</text>
  <text x="55" y="277" class="item-text">InvenSense ICM-42688-P</text>
  <text x="55" y="295" class="item-sub">SPI4: SCK PE2, MISO PE13, MOSI PE6</text>
  <text x="55" y="313" class="item-sub">CS: PE11 | DRDY: PE15 | Rot: -R 6 (270°)</text>

  <rect x="40" y="350" width="220" height="85" class="box" />
  <text x="55" y="375" class="section-title">BAROMETER</text>
  <text x="55" y="397" class="item-text">Infineon DPS310 (Internal)</text>
  <text x="55" y="415" class="item-sub">I2C2: SCL PB10, SDA PB11 @ 0x76</text>

  <rect x="40" y="455" width="220" height="85" class="box" />
  <text x="55" y="480" class="section-title">ANALOG SENSING</text>
  <text x="55" y="502" class="item-text">BAT1: V_DIV (PC0), CURR (PC1)</text>
  <text x="55" y="520" class="item-sub">BAT2: V_DIV (PA4) | ADC3 Internal</text>

  <!-- Right: Outputs & Communications -->
  <rect x="640" y="110" width="220" height="120" class="box" />
  <text x="655" y="135" class="section-title">ESC OUTPUTS (S1–S4)</text>
  <text x="655" y="157" class="item-text">S1-S2: PB0/PB1 (TIM3, DMA1)</text>
  <text x="655" y="175" class="item-text">S3-S4: PA0/PA1 (TIM5, DMA1)</text>
  <text x="655" y="193" class="item-sub">DShot300 / DShot600 / PWM 400Hz</text>
  <text x="655" y="211" class="item-sub">LANRC 45A Bluejay ESCs</text>

  <rect x="640" y="250" width="220" height="100" class="box" />
  <text x="655" y="275" class="section-title">AUX OUTPUTS (S5–S12)</text>
  <text x="655" y="297" class="item-text">S5-S6: PA2/PA3 (TIM5, DMA1)</text>
  <text x="655" y="315" class="item-text">S7-S10: PD12-PD15 (TIM4, DMA1)</text>
  <text x="655" y="333" class="item-sub">S11-S12: PE5/PE6 (TIM15, PWM Only)</text>

  <rect x="640" y="370" width="220" height="100" class="box" />
  <text x="655" y="395" class="section-title">COMMUNICATION PORTS</text>
  <text x="655" y="417" class="item-text">GPS1: USART1 (PA9/PA10)</text>
  <text x="655" y="435" class="item-text">RC: UART5 (PC12) [CRSF/SBUS]</text>
  <text x="655" y="453" class="item-sub">TEL1: USART6 | TEL2: USART2</text>

  <rect x="640" y="490" width="220" height="65" class="box" />
  <text x="655" y="515" class="section-title">STORAGE &amp; USB</text>
  <text x="655" y="535" class="item-text">SDMMC1: MicroSD Card (4-bit)</text>
  <text x="655" y="550" class="item-sub">USB OTG FS: PA11/PA12 (Type-C)</text>

  <!-- Connectors / Lines -->
  <line x1="260" y1="160" x2="310" y2="210" class="bus-line" />
  <line x1="260" y1="280" x2="310" y2="280" class="bus-line" />
  <line x1="260" y1="390" x2="310" y2="350" class="bus-line" />
  <line x1="260" y1="495" x2="330" y2="425" class="bus-line" />

  <line x1="590" y1="210" x2="640" y2="160" class="bus-line" />
  <line x1="590" y1="280" x2="640" y2="280" class="bus-line" />
  <line x1="590" y1="350" x2="640" y2="390" class="bus-line" />
  <line x1="570" y1="425" x2="640" y2="495" class="bus-line" />
</svg>